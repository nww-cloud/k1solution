services:
  - type: web
    name: k1solution-leave-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: k1solution-db
          property: connectionString

databases:
  - name: k1solution-db
    plan: free
