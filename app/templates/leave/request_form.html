{% extends "base.html" %}
{% block title %}휴가 신청{% endblock %}
{% block content %}
<div class="page-header">
    <h2>휴가 신청</h2>
</div>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<form method="post" class="card-form" id="requestForm">
    {% include "leave/_request_dialog_content.html" %}
    <div class="form-actions">
        <a class="btn" href="{{ url_for('leave.dashboard') }}">취소</a>
        <button type="submit" class="btn btn-primary" id="submitRequestBtn">신청</button>
    </div>
</form>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
