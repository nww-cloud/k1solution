<div class="dash-field">
    <label for="kind">휴가 종류 *</label>
    <select id="kind" name="kind">
        <option value="연차">연차</option>
        <option value="근속특별휴가">근속 특별휴가</option>
    </select>
</div>
<div class="dash-field dash-date-range-fields">
    <div>
        <label for="start_date">시작일 *</label>
        <input type="date" id="start_date" name="start_date" value="{{ default_date or '' }}" required>
    </div>
    <div>
        <label for="end_date">종료일 *</label>
        <input type="date" id="end_date" name="end_date" value="{{ default_date or '' }}" required>
    </div>
</div>
<div class="dash-field">
    <label for="unit_select">사용 단위 *</label>
    <select id="unit_select">
        {% for unit_value, label in unit_choices %}
        <option value="{{ loop.index0 }}" data-unit="{{ unit_value }}" data-label="{{ label }}" {% if loop.first %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
    <input type="hidden" id="unit_hidden" name="unit" value="1.0">
    <input type="hidden" id="unit_label_hidden" name="unit_label" value="종일">
</div>

<div class="dash-summary-row" id="requestPreview">
    <div>
        <span class="dash-summary-label">신청 일수</span>
        <span class="dash-summary-value" id="previewTotalDays">-</span>
        <span class="dash-summary-count" id="previewDateCount"></span>
    </div>
    <div>
        <span class="dash-summary-label">확정 후 잔여</span>
        <span class="dash-summary-value" id="previewRemainingAfter">-</span>
    </div>
</div>
<ul class="dash-error-list" id="previewErrors"></ul>
